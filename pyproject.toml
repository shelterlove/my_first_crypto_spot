[project]
name = "crypto-spot-v1"
version = "0.1.0"
description = "Clean V1 migration of the accepted V6.19 crypto spot strategy."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "sqlalchemy",
  "psycopg2-binary",
  "python-dotenv",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
