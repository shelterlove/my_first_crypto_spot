[project]
name = "futures-v1"
version = "1.0.0"
description = "Official ETH/BNB futures strategy for Binance USD-M Futures Testnet."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "sqlalchemy",
  "psycopg2-binary",
  "python-dotenv",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
