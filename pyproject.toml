[project]
name = "crypto-spot-v1"
version = "0.1.0"
description = "Native V4.8 ETH/BNB crypto strategy research and Binance testnet deployment."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "sqlalchemy",
  "psycopg2-binary",
  "python-dotenv",
  "requests",
]

[project.optional-dependencies]
freqtrade = [
  "freqtrade",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
